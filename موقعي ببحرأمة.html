<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرحبًا بكم في موقعي</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:#f0f8ff;color:#183c2b;margin:0;padding:clamp(12px,4vw,36px);line-height:1.9;min-height:100vh}
main{width:100%;max-width:900px;margin:0 auto;background:#fff;padding:clamp(18px,5vw,42px);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.09);overflow-wrap:anywhere}
h1,h2,h3{line-height:1.4;color:#12623e;margin-top:0}
p{font-size:1.05rem;margin:16px 0}
a{color:#087fbd;font-weight:600;text-underline-offset:4px;overflow-wrap:anywhere}
img{display:block;max-width:100%;height:auto;margin:20px auto;border-radius:14px}
button{font:inherit;font-weight:bold;padding:12px 22px;border:0;border-radius:12px;background:#16764a;color:white;cursor:pointer;max-width:100%;box-shadow:0 4px 12px rgba(22,118,74,.2)}
a.bahramah-button{display:inline-block;padding:12px 22px;background:#16764a;color:#fff;text-decoration:none;border-radius:12px;font-weight:bold;margin:8px 0}
button:active{transform:scale(.98)}
footer{text-align:center;max-width:900px;margin:24px auto 0;padding:14px;color:#12623e;font-size:.95rem}
@media(max-width:480px){body{padding:10px 8px;}main{border-radius:14px;}button{width:100%;}p{font-size:1rem}}
</style>
</head>
<body>
<main>
<h1>موقعي الأول</h1>
<p>أتعلم إنشاء المواقع بلغة بحرأمة</p>
</main>
<footer>بحرأمة · لغة برمجة عربية</footer>
</body>
</html>
